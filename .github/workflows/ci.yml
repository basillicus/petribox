name: CI

on:
  push:
    branches: [master, incus-overhaul]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Lint (compile)
        run: python -m compileall petribox
      - name: Unit tests (no e2e)
        run: pytest -m "not e2e" -q
