[workspace]
name = "sandbox"
version = "0.1.0"
description = "Quick AI Experiment VM Manager - Isolated Rocky Linux sandboxes"
authors = ["User"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
sandbox = "python -m sandbox"
create = "python -m sandbox create"
list = "python -m sandbox list"

[dependencies]
python = ">=3.10"
rich = ">=13.0.0"
pyyaml = ">=6.0"

[system-requirements]
linux = "5.10.0"
