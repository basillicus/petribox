[workspace]
name = "petribox"
version = "0.1.0"
description = "Incus-backed sandboxes (dishes) for breeding, running, and migrating AI agents"
authors = ["David Abbasi Perez <david.abbasi.ai@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
petribox = "python -m petribox"

[dependencies]
python = ">=3.10"
rich = ">=13.0.0"
pyyaml = ">=6.0"

[system-requirements]
linux = "5.10.0"
