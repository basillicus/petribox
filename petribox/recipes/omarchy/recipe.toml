# Omarchy VM from Omarchy's official VM image. Import it once:
#   curl -fsSL https://nightly.omarchy.org/stable/latest.json   # vm.url and vm.sha256
#   curl -fLO <vm.url> && echo "<vm.sha256>  omarchy-X.Y.Z.qcow2" | sha256sum -c
#   petribox import-image omarchy-X.Y.Z.qcow2 omarchy-qemu
# The image has sshd but no Incus agent: petribox installs it over SSH with a
# one-off key on the first boot (agent_via_ssh). Desktop login: omarchy/omarchy.
# Hyprland in a VM uses software rendering: usable, not fast.
# Look at it with: incus console <dish> --type=vga
description = "Omarchy VM (official VM image)"
image = "omarchy-qemu"
user = "omarchy"
cpus = 4
memory = "8GiB"
disk = "60GiB"
agent_via_ssh = true
config = { "security.secureboot" = "false" }
