[project]
name = "petribox"
version = "0.2.0"
description = "Incus sandboxes built from recipes: plain image + provisioning script + clean snapshot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
petribox = "petribox.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["petribox*"]

[tool.setuptools.package-data]
petribox = ["recipes/*/*", "recipes/_common.sh"]
