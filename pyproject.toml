[project]
name = "petribox"
version = "0.1.0"
description = "Incus-backed sandboxes (dishes) for breeding, running, and migrating AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Abbasi Perez", email = "david.abbasi.ai@gmail.com" }]
dependencies = [
    "rich>=13.0.0",
    "PyYAML>=6.0",
]

[project.scripts]
petribox = "petribox.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["petribox*"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that create/destroy real Incus instances (require PETRIBOX_E2E=1 and a working `incus`)",
]
