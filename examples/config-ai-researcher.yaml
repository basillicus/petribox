## Minimal Development

```yaml
# config-minimal-dev.yaml
packages:
  - vim-enhanced
  - python3
  - git
  - curl
  - wget
  - tmux

environment:
  EDITOR: vim
```

Usage:
```bash
sandbox create minimal --config config-minimal-dev.yaml
```

