## Agentic AI Development

```yaml
# config-agentic.yaml
packages:
  - vim-enhanced
  - python3
  - python3-pip
  - git
  - curl
  - wget
  - tmux
  - docker
  - docker-compose

pip_packages:
  - jupyterlab
  - langchain
  - langchain-community
  - langchain-openai
  - langgraph
  - pydantic
  - pydantic-settings
  - httpx
  - aiohttp
  - python-dotenv

environment:
  OPENAI_API_KEY: "your-key-here"
  ANTHROPIC_API_KEY: "your-key-here"
  LANGCHAIN_TRACING_V2: "true"

runcmd:
  - sudo systemctl enable --now docker
  - sudo usermod -aG docker $USER
```

Usage:
```bash
sandbox create agent-dev --config config-agentic.yaml --ram 8192 --cpus 4
```

