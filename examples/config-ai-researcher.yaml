# Example Sandbox Configuration Files

This directory contains example configurations for different use cases.

---

## AI Researcher Configuration

```yaml
# config-ai-researcher.yaml
packages:
  - vim-enhanced
  - python3
  - python3-pip
  - python3-devel
  - git
  - curl
  - wget
  - gcc
  - gcc-c++
  - make
  - tmux
  - htop
  - jq

pip_packages:
  - jupyterlab
  - numpy
  - pandas
  - matplotlib
  - scikit-learn
  - scipy
  - jupyterlab-vim

environment:
  JUPYTER_TOKEN: "my-secure-token"
  PYTHONUNBUFFERED: "1"

runcmd:
  - jupyter lab --generate-config
```

Usage:
```bash
sandbox create ai-lab --config config-ai-researcher.yaml --ram 8192 --cpus 4
```

