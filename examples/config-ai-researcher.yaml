## Data Science with Mounts

```yaml
# config-data-science.yaml
packages:
  - vim-enhanced
  - python3
  - python3-pip
  - git
  - tmux
  - htop
  - jq

pip_packages:
  - jupyterlab
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - polars
  - pyarrow

# Note: Mounts can also be specified via CLI --mount option
```

Usage with mounts:
```bash
sandbox create data-sandbox \
  --config config-data-science.yaml \
  --mount ~/datasets:/datasets \
  --mount ~/projects/ml:/projects \
  --ram 16384 --cpus 6
```
